name: tide
description: "A calm, local-first notes app for capturing, reviewing, searching, and resurfacing thoughts."
publish_to: 'none'

version: 1.3.0+8

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.4
  share_plus: ^13.2.1
  file_selector: ^1.1.0
  font_awesome_flutter: ^11.0.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
flutter:

  uses-material-design: true
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/tide-app-icon.png
  image_path_android: assets/icon/tide-app-icon.png
  image_path_ios: assets/icon/tide-app-icon.png
  min_sdk_android: 21
  adaptive_icon_background: assets/icon/tide-app-icon-background.png
  adaptive_icon_foreground: assets/icon/tide-app-icon-foreground.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#1A7180"
  macos:
    generate: true
    image_path: assets/icon/tide-app-icon.png
